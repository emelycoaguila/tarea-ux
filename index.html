
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis notas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Mis notas</h1>
    <p>Escribe tus ideas y guárdalas para recordarlas después.</p>

    <form id="formulario">
      <label for="titulo">Título de la nota</label>
      <input id="titulo" type="text" maxlength="60" required>

      <label for="contenido">Contenido de la nota</label>
      <textarea id="contenido" rows="4" required></textarea>

      <button type="submit">Agregar nota</button>
    </form>

    <p id="mensaje" role="status" aria-live="polite"></p>

    <section aria-labelledby="titulo-notas">
      <h2 id="titulo-notas">Mis notas guardadas</h2>
      <div id="lista-notas"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
